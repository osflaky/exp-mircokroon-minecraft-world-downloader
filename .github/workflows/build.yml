name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '21'
          # Zulu has no JDK 21 build with JavaFX bundled for Windows arm64. JavaFX
          # already comes from the org.openjfx Maven dependencies, so a plain JDK
          # is enough to build on every runner.
        java-package: jdk
    - shell: bash
      run: |
        mvn package -DskipTests ${{ matrix.mvn_args }}
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
